name: stock-system
services:
  frontend:
    ports: !override
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "127.0.0.1:8080:80"
    volumes: !override
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/acme:/var/www/acme:ro
      - ./tls/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/.well-known/acme-challenge/deploy-check"]
