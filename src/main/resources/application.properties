spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库用户名不是秘密；本机开发和测试沿用原来的 root。生产部署可用
# Spring Boot 标准属性 SPRING_DATASOURCE_USERNAME 覆盖为最小权限账号。
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JWT 签名密钥只从运行环境读取；缺少或过短时后端启动失败。
stock-system.jwt.secret=${JWT_SECRET}

# 未显式指定环境时按日常开发环境启动；自动化测试必须显式激活 test。
spring.profiles.default=dev

spring.application.name=stock-system

# Agent 分阶段接入：默认不创建模型客户端，V1 启动不需要模型密钥。
spring.ai.model.chat=${RESEARCH_AGENT_CHAT_MODEL:none}
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=deepseek-flash
spring.ai.deepseek.chat.thinking.type=disabled
spring.ai.deepseek.chat.max-tokens=2000
# 零重试由 ResearchAiConfiguration 的 RetryTemplate 明确控制。

# 本项目直接使用 StringRedisTemplate，不使用 Spring Data Redis Repository 扫描。
spring.data.redis.repositories.enabled=false

mybatis-plus.configuration.map-underscore-to-camel-case=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# 默认关闭的一次性超级管理员初始化。凭据只从临时环境变量读取。
stock-system.super-admin.enabled=${SUPER_ADMIN_INIT_ENABLED:false}
stock-system.super-admin.username=${SUPER_ADMIN_USERNAME:}
stock-system.super-admin.password=${SUPER_ADMIN_PASSWORD:}
stock-system.super-admin.nickname=${SUPER_ADMIN_NICKNAME:}

server.port=8082
