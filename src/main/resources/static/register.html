<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册新用户</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* 确保 padding 不撑开宽度 */
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .footer-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .footer-link a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h2>注册新用户</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>

        <div class="form-group">
            <label for="department">部门</label>
            <select id="department" name="department" required>
                <option value="">请选择部门</option>
                <option value="技术部">技术部</option>
                <option value="人事部">人事部</option>
                <option value="投资部">投资部</option>
            </select>
        </div>

        <div class="form-group">
            <label for="role">角色</label>
            <select id="role" name="role" required>
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">注册</button>
    </form>

    <div class="footer-link">
        已有账号？<a href="login.html">去登录</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        // 阻止表单默认提交刷新页面
        e.preventDefault();

        // 获取表单数据
        const formData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            department: document.getElementById('department').value,
            role: document.getElementById('role').value
        };

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true; // 防止重复点击
        submitBtn.innerText = '注册中...';

        try {
            const response = await fetch('/api/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.code === 1) {
                alert('注册成功');
                window.location.href = 'login.html';
            } else {
                alert(result.msg || '注册失败，请稍后再试');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('网络连接失败，请检查后端服务是否开启');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '注册';
        }
    });
</script>

</body>
</html>
