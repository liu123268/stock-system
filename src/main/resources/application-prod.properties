# 显式激活 prod 后读取容器 Secret；缺少挂载目录时拒绝启动。
spring.config.import=configtree:/run/secrets/
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/stock_system?createDatabaseIfNotExist=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
spring.datasource.username=stock_app
spring.datasource.password=${mysql_app_password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
stock-system.jwt.secret=${jwt_secret}

server.port=8082
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:300ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:500ms}
stock-system.market.redis.enabled=${MARKET_REDIS_ENABLED:true}
stock-system.market.redis.key-prefix=${MARKET_REDIS_KEY_PREFIX:stock-system:market:prod:v1}
stock-system.market.redis.quote-ttl=${MARKET_REDIS_QUOTE_TTL:5s}
stock-system.market.redis.candlestick-ttl=${MARKET_REDIS_CANDLESTICK_TTL:1m}
stock-system.market.redis.historical-ttl=${MARKET_REDIS_HISTORICAL_TTL:12h}
stock-system.market.redis.trading-day-ttl=${MARKET_REDIS_TRADING_DAY_TTL:24h}
stock-system.market.redis.lock-ttl=${MARKET_REDIS_LOCK_TTL:8s}
stock-system.market.redis.lock-wait=${MARKET_REDIS_LOCK_WAIT:800ms}
stock-system.market.redis.failure-cooldown=${MARKET_REDIS_FAILURE_COOLDOWN:30s}
stock-system.market.redis.ttl-jitter-percent=${MARKET_REDIS_TTL_JITTER_PERCENT:10}

# 默认行情模式与 dev 一致；首次验收由 Compose 显式设 MARKET_MODE=directory。
# 完成 Linux CLI 安装和授权后，再将 Compose 的 MARKET_MODE 改为 longbridge。
# directory 不提供真实报价，也不允许创建需要可信报价的新研究周期。
stock-system.market.mode=${MARKET_MODE:longbridge}
stock-system.market.longbridge.transport=cli
stock-system.market.longbridge.executable=${LONGBRIDGE_CLI_PATH:/usr/local/bin/longbridge}
stock-system.market.longbridge.request-timeout=${LONGBRIDGE_REQUEST_TIMEOUT:5s}
stock-system.market.longbridge.cache-ttl=${LONGBRIDGE_CACHE_TTL:5s}
stock-system.market.longbridge.candlestick-cache-ttl=${LONGBRIDGE_CANDLESTICK_CACHE_TTL:1m}
stock-system.market.longbridge.max-concurrent-requests=5
stock-system.market.longbridge.minimum-request-interval=100ms
